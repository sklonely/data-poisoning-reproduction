[project]
name = "metapoison-hpc"
version = "0.1.0"
description = "HPC-friendly helpers for reproducing MetaPoison and comparing a PyTorch victim."
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.10.9",
  "numpy>=1.26,<3",
  "torch>=2.2",
  "torchvision>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metapoison_hpc"]
